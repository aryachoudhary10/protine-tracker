<!doctype html>
<meta charset="utf-8">
<title>Rephrase — Settings</title>
<style>
  :root { color-scheme: light dark; --bg:#f4f7f8; --card:#fff; --fg:#11171b; --muted:#586874;
          --line:#d9e2e7; --accent:#17607f; --accent-fg:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1215; --card:#161d22; --fg:#e6edf2; --muted:#93a3af;
            --line:#27313a; --accent:#6bc2e8; --accent-fg:#06222e; }
  }
  body { margin: 0; padding: 40px 20px; background: var(--bg); color: var(--fg);
         font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 520px; margin: 0 auto; background: var(--card);
         border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
  h1 { margin: 0 0 4px; font-size: 19px; }
  p.sub { margin: 0 0 22px; color: var(--muted); font-size: 13.5px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  input, select { width: 100%; padding: 10px 11px; font: inherit; color: inherit;
                  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
  .field { margin-bottom: 18px; }
  .help { margin-top: 6px; font-size: 12.5px; color: var(--muted); }
  button { padding: 10px 20px; border: 0; border-radius: 8px; background: var(--accent);
           color: var(--accent-fg); font: inherit; font-weight: 600; cursor: pointer; }
  #status { margin-left: 12px; font-size: 13px; color: var(--muted); }
</style>
<main>
  <h1>Rephrase</h1>
  <p class="sub">Point the extension at your deployment.</p>

  <div class="field">
    <label for="apiBase">Site URL</label>
    <input id="apiBase" type="url" placeholder="https://aryaai.online" spellcheck="false">
    <p class="help">Where your Rephrase site is deployed. The extension calls <code>/api/rephrase</code> there.</p>
  </div>

  <div class="field">
    <label for="tone">Default style</label>
    <select id="tone"></select>
    <p class="help">Used by the toolbar button and the keyboard shortcut. The right-click menu always lets you pick.</p>
  </div>

  <button id="save">Save</button><span id="status"></span>
</main>
<script src="options.js"></script>
