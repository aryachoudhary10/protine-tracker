<!doctype html><meta charset="utf-8"><title>React controlled input</title>
<div id="root"></div>
<script src="../node_modules/react/umd/react.production.min.js"></script>
<script src="../node_modules/react-dom/umd/react-dom.production.min.js"></script>
<script>
const { useState, createElement: h } = React;
function App() {
  const [v, setV] = useState("pls send that file asap");
  const [changes, setChanges] = useState(0);
  // Classic controlled input: value comes from state, and React will revert
  // any direct DOM mutation it does not see through its own onChange.
  return h("div", null,
    h("textarea", { id: "ta", rows: 3, cols: 50, value: v,
      onChange: (e) => { setV(e.target.value); setChanges((c) => c + 1); } }),
    h("p", { id: "state" }, v),
    h("p", { id: "count" }, String(changes))
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
